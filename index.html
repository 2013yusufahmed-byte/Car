<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Racing Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="menu" class="menu active">
        <div class="menu-container">
            <h1>🏎️ Car Racing Game</h1>
            <div class="menu-section">
                <h2>Select Car</h2>
                <div id="carSelection" class="selection-grid"></div>
            </div>
            <div class="menu-section">
                <h2>Select Track</h2>
                <div id="trackSelection" class="selection-grid"></div>
            </div>
            <button id="startButton" class="btn btn-primary" disabled>START RACE</button>
        </div>
    </div>

    <div id="gameContainer" class="game-hidden">
        <canvas id="gameCanvas"></canvas>
        <div id="hud" class="hud">
            <div class="hud-item">
                <span>Speed:</span>
                <span id="speedometer">0</span> km/h
            </div>
            <div class="hud-item">
                <span>Position:</span>
                <span id="position">1/4</span>
            </div>
            <div class="hud-item">
                <span>Lap:</span>
                <span id="lapCounter">1/3</span>
            </div>
            <div class="hud-item">
                <span>Time:</span>
                <span id="timer">00:00</span>
            </div>
        </div>
    </div>

    <div id="gameOverScreen" class="game-over hidden">
        <div class="game-over-content">
            <h1 id="gameOverTitle">Race Finished!</h1>
            <div id="raceResults"></div>
            <button id="playAgainButton" class="btn btn-primary">Play Again</button>
            <button id="menuButton" class="btn btn-secondary">Main Menu</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
